# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "/srv/formula/MFHome"
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.14
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: "pip"
        cache-dependency-path: srcMFHome/requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 -r srcMFHome/requirements.txt

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 srcMFHome --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 srcMFHome --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Validate Docker Compose configuration
      run: |
        docker compose \
          -f docker-compose.yml \
          config --quiet

    - name: Build and deploy
      run: |
        # --wait blocks until containers are healthy/ready.
        docker compose \
          -f docker-compose.yml \
          up --detach --build --remove-orphans --wait

    - name: Validate Docker Server Configuration
      run: |
        docker compose \
          -f docker-compose.yml \
          -f docker-compose.server.yml \
          config --quiet
    
    - name: Deploy with server override
      run: |
        # --wait blocks until containers are healthy/ready.
        docker compose \
          -f docker-compose.yml \
          -f docker-compose.server.yml \
          up --detach --build --remove-orphans

    - name: Show logs if failed
      if: failure()
      run: |
        docker compose -f docker-compose.yml logs
    
    - name: Show deployment status
      if: always()
      run: |
        docker compose \
          -f docker-compose.yml \
          ps
